# 2. Dependency updates: GitHub opens pull requests when a library
# (or a GitHub Action) has a newer or security-fixed version.
# Delete the ecosystems you don't use when copying to another repo.
#
# "cooldown" waits 7 days before proposing a brand-new release. Malicious
# or broken releases are usually caught within days. Security fixes
# are not delayed by this.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Uncomment for JavaScript/Node projects:
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   cooldown:
  #     default-days: 7

  # Keeps the pinned action SHAs in your workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
