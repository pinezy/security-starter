name: security-checks

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job gets read-only access unless it asks for more.
permissions:
  contents: read

# Cancel older runs of the same branch when you push again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Secret scanning
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # lets the action look at PR commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if this repo belongs to an Organization (free key from gitleaks.io):
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 2. Dependency vulnerability check (Python)
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Audit requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      # JavaScript/Node projects: replace the two steps above with
      #   - uses: actions/setup-node@<pinned sha>
      #   - run: npm audit --audit-level=high

  # 3. Static analysis
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run Semgrep
        run: |
          python -m pip install semgrep==1.184.0
          semgrep scan --config p/default --error --metrics=off
